<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .mn-chips::-webkit-scrollbar, .mn-scroll::-webkit-scrollbar { width:0; height:0; }
</style>
</helmet>
<div style="position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;font-family:{{ fontStack }}">

  <div style="flex:none;display:flex;align-items:center;gap:12px;padding:12px 16px 12px;border-bottom:1px solid #ECEDF0">
    <div onClick="{{ onClose }}" style="width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;background:#F4F5F7">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16202E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
    </div>
    <div style="flex:1;min-width:0;display:flex;align-items:center;gap:8px">
      <span style="font-size:18px;font-weight:800;color:#16202E;letter-spacing:-.01em">Notifications</span>
      <span style="font-size:10.5px;font-weight:800;color:#fff;border-radius:999px;padding:2px 7px;background:{{ accentColor }}">3 new</span>
    </div>
    <span style="font-size:12.5px;font-weight:700;color:#0A58CA;cursor:pointer;flex:none">Mark all read</span>
  </div>

  <div class="mn-chips" style="flex:none;display:flex;gap:7px;padding:12px 16px;overflow-x:auto;border-bottom:1px solid #F1F2F4">
    <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
      <div onClick="{{ t.onPick }}" style="display:flex;align-items:center;gap:6px;border-radius:999px;padding:7px 13px;cursor:pointer;flex:none;{{ t.style }}">
        <span style="font-size:12.5px;font-weight:700">{{ t.label }}</span>
        <span style="font-size:11px;font-weight:800;opacity:.72">{{ t.count }}</span>
      </div>
    </sc-for>
  </div>

  <div class="mn-scroll" style="flex:1;overflow-y:auto">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
      <div style="border-bottom:1px solid #F1F2F4">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px">
          <span style="font-size:11px;font-weight:800;color:#8A93A2;letter-spacing:.08em;text-transform:uppercase">{{ g.title }}</span>
          <sc-if value="{{ g.hasItems }}" hint-placeholder-val="{{ true }}">
            <span style="font-size:12.5px;font-weight:700;color:#0A58CA;cursor:pointer">Show all</span>
          </sc-if>
        </div>

        <sc-if value="{{ g.isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;gap:9px;padding:2px 16px 16px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B7C3D0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
            <span style="font-size:13.5px;font-weight:600;color:#9AA1AE">All caught up</span>
          </div>
        </sc-if>

        <sc-for list="{{ g.items }}" as="n" hint-placeholder-count="2">
          <div style="display:flex;align-items:flex-start;gap:12px;padding:12px 16px 15px;cursor:pointer;{{ n.rowBg }}">
            <div style="width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;display:flex;align-items:center;justify-content:center;background:{{ n.color }}">
              <sc-if value="{{ n.photo }}" hint-placeholder-val="{{ false }}"><img src="{{ n.photo }}" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></sc-if>
              <sc-if value="{{ n.showInitials }}" hint-placeholder-val="{{ true }}"><span style="font-size:14.5px;font-weight:800;color:#fff">{{ n.initials }}</span></sc-if>
            </div>
            <div style="flex:1;min-width:0">
              <div style="font-size:14.5px;color:#414B5A;line-height:1.45"><span style="font-weight:800;color:#16202E">{{ n.name }}</span> {{ n.text }}</div>
              <div style="font-size:12px;font-weight:600;color:#9AA1AE;margin-top:4px">{{ n.time }}</div>
              <sc-if value="{{ n.actionable }}" hint-placeholder-val="{{ false }}">
                <div style="display:flex;gap:8px;margin-top:11px">
                  <div style="display:flex;align-items:center;justify-content:center;background:#0A58CA;border-radius:8px;padding:10px 20px;cursor:pointer"><span style="font-size:13px;font-weight:800;color:#fff">Accept</span></div>
                  <div style="display:flex;align-items:center;justify-content:center;background:#EFF1F4;border-radius:8px;padding:10px 20px;cursor:pointer"><span style="font-size:13px;font-weight:800;color:#16202E">Ignore</span></div>
                </div>
              </sc-if>
            </div>
            <sc-if value="{{ n.unread }}" hint-placeholder-val="{{ true }}">
              <div style="width:8px;height:8px;border-radius:50%;background:#0A58CA;flex:none;margin-top:7px"></div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </sc-for>
    <div style="height:26px"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:392,&quot;height&quot;:760},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E6334C&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#E6334C&quot;,&quot;#FA2838&quot;,&quot;#0A58CA&quot;]},&quot;font&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Plus Jakarta Sans&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
class Component extends DCLogic {
  state = { tab: 'All' };

  GROUPS = [
    { key:'Connections', title:'Connection request', items:[
      { name:'Ashish Kapahi', text:'accepted your connection request.', time:'08 Aug 2026 · 08:52 PM', photo:'images/ashish.png', color:'#243B53', unread:true, actionable:false },
      { name:'Nguyen Hoang Hiep', text:'wishes to connect with you.', time:'08 Aug 2026 · 06:20 PM', initials:'NH', color:'#3D5A47', unread:true, actionable:true },
      { name:'Farah Ismail', text:'wishes to connect with you.', time:'07 Aug 2026 · 11:05 AM', initials:'FI', color:'#6B3651', unread:true, actionable:true },
    ]},
    { key:'Groups', title:'Group request', items:[] },
    { key:'Articles', title:'Article', items:[] },
  ];

  renderVals() {
    const tab = this.state.tab;
    const accentColor = this.props.accent || '#E6334C';
    const shown = tab === 'All' ? this.GROUPS : this.GROUPS.filter(g => g.key === tab);
    return {
      accentColor,
      fontStack: (this.props.font || 'Plus Jakarta Sans') + ',sans-serif',
      onClose: this.props.onClose || (() => {}),
      tabs: ['All','Connections','Groups','Articles'].map(label => {
        const on = tab === label;
        const count = label === 'All'
          ? this.GROUPS.reduce((a,g) => a + g.items.length, 0)
          : (this.GROUPS.find(g => g.key === label) || { items:[] }).items.length;
        return {
          label, count,
          onPick: () => this.setState({ tab: label }),
          style: on ? 'background:#0A58CA;color:#fff;' : 'background:#F1F2F5;color:#5B6675;',
        };
      }),
      groups: shown.map(g => ({
        title: g.title,
        hasItems: g.items.length > 0,
        isEmpty: g.items.length === 0,
        items: g.items.map(n => ({ ...n, showInitials: !n.photo, rowBg: n.unread ? 'background:#F7FAFF;' : '' })),
      })),
    };
  }
}
</script>
</body>
</html>
